# Set the physical channel and device path for the installation site.
channels:
  - name: 地上波
    type: GR
    channel: T23

tuners:
  - name: 地上波チューナー
    types: [GR]
    command: recisdb tune --device /dev/px4video2 --channel {{{channel}}} -

# For an external decoder, add --no-decode to the tuner command.
